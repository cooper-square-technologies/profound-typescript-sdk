name: Filter builder CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npx tsc -p tests/tsconfig.json
      - run: npx --yes tsx tests/filter.test.ts
      - run: npm run generate:filter-table -- tests/fixtures/filter-grammar.openapi.json
      - run: git diff --exit-code -- src/lib/filter-table.ts
