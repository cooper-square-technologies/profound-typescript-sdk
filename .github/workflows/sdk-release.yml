name: TypeScript SDK Release

on:
  # Manual re-publish only: the automated publish for each release runs as the `publish` job
  # inside release-please.yml, in the same run that cuts the tag (dispatching a workflow here
  # instead would resolve it on the repository's default branch only, which breaks releasing
  # from any other release line). Dispatch this workflow at an existing release tag to re-run
  # a failed or skipped publish. A dispatched run is top-level, so OIDC trusted-publisher
  # claims name this file; register it as an additional trusted publisher only when manual
  # re-publishes are used. Never add a workflow_call trigger here — registries reject
  # publishes from called (reusable) workflows.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSIONING_POLICY: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Installed after Node is set up, so it lands ahead of the Yarn 1 the runner image ships. A
      # repository whose `.yarnrc.yml` names a `yarnPath` still runs its own committed Yarn release.
      - run: npm install -g @yarnpkg/cli-dist@4.18.1
      # The generator writes no lockfile, so the generated branch never carries one, while a branch
      # that commits `yarn.lock` wants every install held to it, the release job most of all. Yarn
      # turns immutable installs on whenever `CI` is set and then refuses to create a lockfile, so both
      # flags are spelled out. `node-modules` replaces Plug'n'Play because the npm publish build reads
      # `tsc` from `node_modules`; the build step sets it too, or Yarn looks for a Plug'n'Play install
      # and reports the project as not installed.
      - name: Install dependencies
        env:
          YARN_NODE_LINKER: node-modules
        run: |
          if [ -f yarn.lock ]; then
            yarn install --immutable
          else
            yarn install --no-immutable
          fi
      - run: yarn run build
        env:
          YARN_NODE_LINKER: node-modules
      # OIDC trusted publishing needs npm >= 11.5; pinned to the major (not `latest`) so a new
      # npm major raising its Node engine floor cannot break publishes against the pinned Node.
      - run: npm install -g npm@11
      - name: Publish to npm
        run: node scripts/publish-npm.mjs
